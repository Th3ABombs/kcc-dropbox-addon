name: "KCC Dropbox Webhook"
version: "2.6.3"
slug: "kcc_dropbox_webhook"
description: "Convert Suwayomi downloads with KCC and upload to Dropbox"
url: "https://github.com/Th3ABombs/kcc-dropbox-addon/tree/main/kcc_dropbox_webhook"
startup: application
boot: auto
init: false
panel_icon: mdi:book-sync
hassio_api: true
homeassistant_api: true

arch:
  - amd64
  - aarch64

map:
  - type: share
    read_only: false

ports:
  5005/tcp: 5005
ports_description:
  5005/tcp: "KCC Dropbox Webhook"

webui: "http://[HOST]:[PORT:5005]/health"

options:
  log_level: "info"
  output_dir: "/share/kcc-output"
  watch_root: "/share/suwayomi/downloads/mangas"
  dropbox_folder: "/Applicazioni/Kobo Cloud Sync"
  dropbox_app_key: ""
  dropbox_app_secret: ""
  dropbox_refresh_token: ""
  kobo_device: "Kobo Libra Colour"
  format: "KEPUB"
  manga_mode: true
  upscale: true
  stretch: false
  source_in_title: false
  author: ""
  pad_chapter_digits: 0
  force_creator_to_series: false
  file_stable_timeout: 180
  file_stable_for: 5
  file_stable_interval: 1
  kcc_timeout: 1800
  notify_on_success: false
  notify_service: ""
  sync_on_convert: false
  sync_delete_orphans: false
  sync_delete_limit: 50
  keep_local_outputs: false
  max_job_history: 100

schema:
  log_level: list(trace|debug|info|warning|error)
  output_dir: str
  watch_root: str
  dropbox_folder: str
  dropbox_app_key: password
  dropbox_app_secret: password
  dropbox_refresh_token: password
  kobo_device: list(Kobo Libra Colour|Kobo Clara Colour|Kobo Clara BW|Kobo Elipsa 2E|Kobo Clara 2E|Kobo Sage|Kobo Libra 2|Kobo Elipsa|Kobo Nia|Kobo Libra H2O|Kobo Forma|Kobo Clara HD|Kobo Aura H2O Edition 2|Kobo Aura ONE|Kobo Aura Edition 2|Kobo Aura|Kobo Touch 2.0|Kobo Glo HD|Kobo Aura H2O|Kobo Aura HD|Kobo Glo|Kobo Touch)
  format: list(EPUB|KEPUB|CBZ)
  manga_mode: bool
  upscale: bool
  stretch: bool
  source_in_title: bool
  author: str
  pad_chapter_digits: int(0,6)
  force_creator_to_series: bool
  file_stable_timeout: int(10,3600)
  file_stable_for: int(1,120)
  file_stable_interval: float(0.1,30)
  kcc_timeout: int(30,7200)
  notify_on_success: bool
  notify_service: str
  sync_on_convert: bool
  sync_delete_orphans: bool
  sync_delete_limit: int(0,10000)
  keep_local_outputs: bool
  max_job_history: int(10,5000)
